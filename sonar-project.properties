sonar.projectKey=el-comite-pdca
sonar.projectName=El Comite PDCA
sonar.projectVersion=1.0

# Fuentes a analizar (backend y frontend)
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests

# Exclusiones
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/__pycache__/**,**/coverage/**,**/*.sqlite,backend/tests/**

# Cobertura y reportes
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.junit.reportPaths=backend-test-results.xml

sonar.sourceEncoding=UTF-8
