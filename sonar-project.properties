sonar.projectKey=ElComitePDCA
sonar.projectName=ElComitePDCA
sonar.projectVersion=1.0

# --- Fuentes y Pruebas ---
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src

# --- Exclusiones de Análisis ---
sonar.exclusions=**/node_modules/**,**/venv/**,**/.venv/**,**/__pycache__/**,**/*.config.js,frontend/src/**/*.test.jsx,frontend/src/**/*.test.js,frontend/src/**/*.spec.jsx,frontend/src/**/*.spec.js,frontend/src/setupTests.js

# --- Inclusiones de Pruebas Frontend ---
sonar.test.inclusions=backend/tests/**/*.py,frontend/src/**/*.test.jsx,frontend/src/**/*.test.js,frontend/src/**/*.spec.jsx,frontend/src/**/*.spec.js

# --- Configuración de Cobertura ---
sonar.python.version=3.10
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info