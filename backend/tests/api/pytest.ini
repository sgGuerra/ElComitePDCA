[pytest]
# Suite de API aislada. Al tener su propio pytest.ini, rootdir y confcutdir
# quedan en esta carpeta: backend/tests/conftest.py (suite heredada basada en
# pytest-asyncio) NO se carga. Ejecutar desde esta carpeta con `pytest`, o
# desde la raíz del repositorio con:
#   pytest -c backend/tests/api/pytest.ini backend/tests/api
testpaths = .
pythonpath = ../..
addopts = -ra --strict-markers
xfail_strict = true
